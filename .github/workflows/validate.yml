name: validate-starter-kit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-22.04
            python: '3.8'
          - os: windows-latest
            python: '3.12'
          - os: windows-latest
            python: '3.8'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Optional XLSX test dependency
        run: python -m pip install openpyxl==3.1.5
      - name: Compile helpers without writing caches
        run: python -c "from pathlib import Path; [compile(p.read_bytes(), str(p), 'exec') for p in Path('scripts').glob('*.py')]"
      - name: Evidence, data, lifecycle and package regressions
        run: python -B -m unittest discover -s tests -v
      - name: PowerShell entry points
        shell: pwsh
        run: |
          $TaskRoot = Join-Path $env:RUNNER_TEMP ("myskill-pwsh-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $TaskRoot | Out-Null
          git -C $TaskRoot init -q
          & ./install.ps1 -Target $TaskRoot
          if ($LASTEXITCODE -ne 0) { throw "install failed" }
          & (Join-Path $TaskRoot '.hackathon-kit/scripts/doctor.ps1')
          if ($LASTEXITCODE -ne 0) { throw "doctor failed" }
          Add-Content -Path (Join-Path $TaskRoot '.hackathon-kit/run/DECISIONS.md') -Value 'KEEP_PWSH'
          & ./install.ps1 -Target $TaskRoot
          if ($LASTEXITCODE -ne 0) { throw "reinstall failed" }
          if (-not (Select-String -Quiet -Path (Join-Path $TaskRoot '.hackathon-kit/run/DECISIONS.md') -Pattern KEEP_PWSH)) { throw "notes overwritten" }
          & (Join-Path $TaskRoot '.hackathon-kit/scripts/clean.ps1') -Apply
          if ($LASTEXITCODE -ne 0) { throw "cleanup failed" }
          if (Test-Path (Join-Path $TaskRoot '.hackathon-kit')) { throw "helpers remain" }

  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build flat distribution
        run: |
          python -B scripts/package_release.py --source . --output /tmp/Myskill-exam-safe.zip
          python -c "from pathlib import Path; import zipfile; p=Path('/tmp/myskill-artifact'); p.mkdir(); zipfile.ZipFile('/tmp/Myskill-exam-safe.zip').extractall(p)"
      - name: Upload directly extractable package
        uses: actions/upload-artifact@v4
        with:
          name: Myskill-exam-safe
          path: /tmp/myskill-artifact/
          include-hidden-files: true
          if-no-files-found: error
